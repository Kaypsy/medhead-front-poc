<div class="login-page">
  <div class="login-card">
    <header class="card-header">
      <p class="card-kicker">Gestion des lits</p>
    </header>

    <div class="card-body">
      <h1 class="card-title">Bonjour, bienvenue dans l'interface! 👋👋</h1>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <label class="input-group">
          <span class="input-label">Login</span>
          <input
            type="text"
            formControlName="username"
            name="username"
            autocomplete="username"
            [class.invalid]="loginForm.controls.username.invalid && loginForm.controls.username.touched"
          />
          @if (loginForm.controls.username.touched && loginForm.controls.username.invalid) {
            <span class="error">Indiquez votre login.</span>
          }
        </label>

        <label class="input-group">
          <span class="input-label">Mot de passe</span>
          <div class="password-wrapper">
            <input
              [type]="passwordFieldType"
              formControlName="password"
              name="password"
              autocomplete="current-password"
              [class.invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
            />
            <button
              class="password-toggle"
              type="button"
              [attr.aria-label]="passwordToggleLabel"
              [attr.title]="passwordToggleLabel"
              [attr.aria-pressed]="showPassword"
              (mousedown)="$event.preventDefault()"
              (touchstart)="$event.preventDefault()"
              (click)="togglePasswordVisibility()"
            >
              @if (showPassword) {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                  />
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path
                    d="M4.5 6.5 19.5 17.5M3 12s3.5-6 9-6c2.5 0 4.6 1.2 6.1 2.6M21 12s-3.5 6-9 6c-2.2 0-4.2-0.9-5.7-2.1"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                  <path
                    d="M9.2 9.3a3 3 0 0 0 4.2 4.2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                  />
                </svg>
              }
            </button>
          </div>
          @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
            <span class="error">Indiquez votre mot de passe.</span>
          }
        </label>

        <label class="checkbox">
          <input type="checkbox" formControlName="remember" />
          <span>Se souvenir de moi</span>
        </label>

        <button class="cta" type="submit" [disabled]="loginForm.invalid || loading">
          @if (loading) {
            <span class="spinner" aria-hidden="true"></span>
          } @else {
            <span>Se connecter</span>
          }
        </button>
      </form>

      @if (errorMessage) {
        <p class="error global">{{ errorMessage }}</p>
      }
    </div>

    <footer class="card-footer">
      <p>Tout droit réservés 2025.</p>
    </footer>
  </div>

  <section class="hero">
    <img src="/assets/illustrations/drawkit-illustration.svg" alt="" class="hero-illustration" />
    <h2>Espace privé</h2>
    <p>Seules les personnes habilités peuvent aceder à cet interface.</p>
  </section>
</div>
